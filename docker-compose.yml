services:
  imgbed:
    # Build this checkout, rather than pulling the upstream Docker Hub image.
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudflare-imgbed-local:latest
    ports:
      # Caddy is the only public entry point. Keep the application private.
      - "127.0.0.1:7658:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
